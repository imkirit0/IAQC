<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RDS — Risk Detection System</title>
<meta name="color-scheme" content="light dark">
<script>
  // Resolve theme before first paint: saved choice, else system preference.
  (function () {
    var p = "system";
    try { p = localStorage.getItem("rds-theme") || "system"; } catch (e) {}
    var dark = p === "dark" || (p === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    document.documentElement.dataset.themePref = p;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ec; --sheet:#fffefb; --sunk:#ece9e1; --side:#ecE9e1; --hover:#f7f5f0;
  --rule:#e1dcd1; --rule-2:#cbc4b5;
  --ink:#1a1c20; --ink-2:#45484f; --ink-3:#66686e;
  --accent:#233a5e; --accent-2:#172944; --accent-soft:#e3e8f0; --on-accent:#fff;
  --green:#2c6639; --green-soft:#e2ece0; --green-mark:#3f8a52;
  --amber:#7f5800; --amber-soft:#f4e9cf; --amber-mark:#c8961a;
  --red:#9b2829; --red-soft:#f5e1dd; --red-mark:#c0392b;
  --crit:#6e1b1b; --crit-soft:#f8ebe7; --crit-rule:#e3bfb8;
  --grey:#5f6064; --grey-soft:#e8e5de; --grey-mark:#a09d96;
  --band-g:#e9f1e6; --band-y:#f8f0dc; --band-r:#f7e6e2;
  --shadow:0 1px 1px rgba(26,28,32,.04),0 6px 20px -10px rgba(26,28,32,.14);
  --shadow-lg:0 2px 4px rgba(26,28,32,.06),0 24px 60px -20px rgba(26,28,32,.35);
  --scrim:rgba(26,28,32,.42);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:4px; --r-lg:6px;
  --ease:cubic-bezier(.16,1,.3,1);
}
:root[data-theme="dark"]{
  --bg:#131417; --sheet:#1b1c20; --sunk:#222328; --side:#17181b; --hover:#212227;
  --rule:#2c2d33; --rule-2:#3d3e45;
  --ink:#ece8df; --ink-2:#bdb9b0; --ink-3:#928f88;
  --accent:#a9bde0; --accent-2:#c4d3ec; --accent-soft:#242b3b; --on-accent:#10151f;
  --green:#93c99f; --green-soft:#1c2a20; --green-mark:#5fae73;
  --amber:#e3c06c; --amber-soft:#2c2515; --amber-mark:#d4a531;
  --red:#f09a90; --red-soft:#331f1e; --red-mark:#e05d4f;
  --crit:#f6b8ae; --crit-soft:#2a1918; --crit-rule:#5c2c27;
  --grey:#a8a59e; --grey-soft:#26272b; --grey-mark:#6f6d68;
  --band-g:#1a2420; --band-y:#26221a; --band-r:#2a1d1d;
  --shadow:0 1px 1px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 30px 70px -20px rgba(0,0,0,.8);
  --scrim:rgba(5,6,8,.62);
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--bg);scrollbar-color:var(--rule-2) transparent}
body{font:14px/1.55 var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"lnum" 1;caret-color:var(--accent)}
::selection{background:var(--accent);color:var(--on-accent)}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:8px;border:2px solid var(--bg)} ::-webkit-scrollbar-track{background:transparent}
a{color:var(--accent);text-decoration:none;text-underline-offset:3px;text-decoration-thickness:1px} a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
h1{font:500 28px/1.15 var(--serif);letter-spacing:-.01em}
h2{font:500 19px/1.25 var(--serif);letter-spacing:-.005em}
h3{font-size:13.5px;font-weight:600;letter-spacing:.005em}
svg.i{width:16px;height:16px;flex:none;vertical-align:-3px}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:12.5px} .nowrap{white-space:nowrap} .right{text-align:right} .center{text-align:center}
.mono{font-variant-numeric:tabular-nums lining-nums}
.code{font-size:11.5px;letter-spacing:.06em;color:var(--ink-3);font-weight:500}
.num{font-family:var(--serif);font-weight:500;font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--rule-2);background:var(--sheet);color:var(--ink);padding:7px 13px;border-radius:var(--r);cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--hover);border-color:var(--ink-3);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)} .btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.quiet{border-color:transparent;background:transparent} .btn.quiet:hover{background:var(--sunk)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.loading{color:transparent!important;position:relative;pointer-events:none}
.btn.loading::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--on-accent);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
input,select,textarea{border:1px solid var(--rule-2);background:var(--sheet);border-radius:var(--r);padding:8px 10px;width:100%;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:var(--ink-3)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input[readonly],input:disabled{background:var(--sunk);color:var(--ink-2)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
:root[data-theme="dark"] input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
textarea{min-height:68px;resize:vertical;line-height:1.5}
label.f{display:block;margin-bottom:14px} label.f>span{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.check{display:flex;align-items:center;gap:9px;margin-bottom:10px;cursor:pointer} .check input{width:auto;margin:0}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap} .grow{flex:1;min-width:0} .spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.mt{margin-top:22px}

/* layout: masthead + full-width page */
.app{min-height:100vh;display:flex;flex-direction:column}
.mast{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.3) blur(12px);border-bottom:1px solid var(--rule)}
.mast-in{max-width:1480px;margin:0 auto;padding:0 40px;display:flex;align-items:stretch;gap:36px;height:60px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;flex:none}
.brand:hover{text-decoration:none}
.brand b{font:600 23px/1 var(--serif);letter-spacing:.03em}
.brand small{font-size:11px;line-height:1.3;color:var(--ink-3);border-left:1px solid var(--rule-2);padding-left:12px}
.nav{display:flex;align-items:stretch;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav a{position:relative;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--ink-2);font-weight:500;font-size:13.5px;white-space:nowrap;transition:color .15s}
.nav a:hover{color:var(--ink);text-decoration:none}
.nav a::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--ink);transform:scaleX(0);transition:transform .25s var(--ease)}
.nav a.on{color:var(--ink)} .nav a.on::after{transform:scaleX(1)}
.nav svg{width:16px;height:16px;opacity:.75}
.mast-end{display:flex;align-items:center;gap:12px;flex:none}
.stamp{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--amber-mark);color:var(--amber);border-radius:2px;white-space:nowrap}
.stamp.ro{border-color:var(--rule-2);color:var(--ink-3)}
.user{position:relative}
.user>button{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:4px 6px 4px 4px;border-radius:999px;color:var(--ink)}
.user>button:hover{background:var(--sunk)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 12px var(--sans);letter-spacing:.03em}
.user .who{text-align:left;line-height:1.2} .user .who b{display:block;font-size:13px;font-weight:600} .user .who span{font-size:11.5px;color:var(--ink-3)}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:260px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:6px;display:none;animation:rise .22s var(--ease)}
.user.open .menu{display:block}
.menu .head{padding:10px 10px 12px;border-bottom:1px solid var(--rule);margin-bottom:6px} .menu .head b{display:block} .menu .head span{font-size:12px;color:var(--ink-3)}
.menu button.item{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:var(--r);cursor:pointer;font-size:13.5px;color:var(--ink);text-align:left}
.menu button.item:hover{background:var(--sunk)}
.menu .lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:10px 10px 6px;border-top:1px solid var(--rule);margin-top:6px}
.menu .theme{margin:0 10px 8px;display:flex} .menu .theme button{flex:1;justify-content:center}
.theme{display:inline-flex;border:1px solid var(--rule-2);border-radius:var(--r);padding:2px;gap:2px;background:var(--sheet)}
.theme button{border:0;background:none;border-radius:3px;padding:5px 9px;cursor:pointer;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500}
.theme button:hover{color:var(--ink)} .theme button[aria-pressed=true]{background:var(--sunk);color:var(--ink)}
.theme svg{width:14px;height:14px}
.main{flex:1;min-width:0}
.content{padding:36px 40px 72px;max-width:1480px;margin:0 auto;width:100%}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.ph h1{font-size:34px;letter-spacing:-.015em}
.ph .sub{color:var(--ink-3);font-size:13.5px;margin-top:8px}
.ph .back{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink-3);margin-bottom:10px} .ph .back:hover{color:var(--ink)}
/* page compositions */
.with-rail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.rail{display:flex;flex-direction:column;gap:22px;position:sticky;top:84px}
.rail .card+.card{margin-top:0}
.rail h3{font:500 16px var(--serif);letter-spacing:0}
.mini-list{list-style:none;margin:0;padding:0}
.mini-list li{padding:11px 0;border-bottom:1px solid var(--rule);font-size:13px} .mini-list li:last-child{border-bottom:0;padding-bottom:0} .mini-list li:first-child{padding-top:0}
.mini-list a{color:var(--ink);font-weight:600} .mini-list a:hover{color:var(--accent)}
.menu-btn{display:none}

/* sheets */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card>.hd{display:flex;align-items:center;gap:10px 14px;padding:15px 20px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.card>.bd{padding:20px} .card+.card{margin-top:22px}
/* ledger strip (replaces metric tiles) */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r-lg);overflow:hidden;margin-bottom:22px;box-shadow:var(--shadow)}
.kpi{background:var(--sheet);padding:14px 18px 15px;display:flex;flex-direction:column}
.kpi .l{font-size:11.5px;color:var(--ink-3);font-weight:500;display:flex;align-items:center;gap:7px}
.kpi .v{font:500 30px/1.1 var(--serif);margin-top:8px;font-variant-numeric:tabular-nums lining-nums}
.kpi .small{margin-top:2px}
.kpi.g .l::before,.kpi.y .l::before,.kpi.r .l::before,.kpi.c .l::before{content:"";width:8px;height:8px;flex:none}
.kpi.g .l::before{background:var(--green-mark)} .kpi.y .l::before{background:var(--amber-mark)} .kpi.r .l::before{background:var(--red-mark)} .kpi.c .l::before{background:var(--crit);transform:rotate(45deg) scale(.85)}
.kpi.c{background:var(--crit-soft)} .kpi.c .v{color:var(--crit)}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--rule-2);white-space:nowrap;background:var(--sheet);position:sticky;top:0}
th.sort{cursor:pointer;user-select:none} th.sort:hover{color:var(--ink)} th.sorted{color:var(--ink)}
th svg.i{width:12px;height:12px;vertical-align:-1px;margin-left:3px}
td{padding:11px 14px;border-bottom:1px solid var(--rule);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s} tbody tr:hover td{background:var(--hover)}
tr.inactive td{opacity:.5}
tr.alert-row td{background:var(--crit-soft)} tr.alert-row:hover td{background:var(--crit-soft)}
tr.group td{background:var(--sunk);font:500 14px var(--serif);padding:8px 14px}
tr.total td{border-top:1px solid var(--rule-2);font-weight:600}
td a b{color:var(--ink);font-weight:600} td a:hover b{color:var(--accent)}
.rank{font:500 17px var(--serif);color:var(--ink-3)}

/* risk marks */
.badge{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--ink-2)}
.badge::before{content:"";width:9px;height:9px;flex:none;background:var(--grey-mark)}
.b-green{color:var(--green)} .b-green::before{background:var(--green-mark)}
.b-yellow{color:var(--amber)} .b-yellow::before{background:var(--amber-mark)}
.b-red{color:var(--red)} .b-red::before{background:var(--red-mark)}
.b-grey::before{background:transparent;border:1.5px solid var(--grey-mark)}
.chip{display:inline-block;padding:1px 6px;border-radius:2px;font-size:11px;font-weight:600;letter-spacing:.02em;background:var(--grey-soft);color:var(--ink-2);white-space:nowrap}
.chip.Critical{background:var(--red-soft);color:var(--red)} .chip.High{background:var(--amber-soft);color:var(--amber)} .chip.Medium{background:var(--accent-soft);color:var(--accent)} .chip.Low{background:var(--grey-soft);color:var(--grey)}
.chip.crit{background:transparent;color:var(--crit);box-shadow:inset 0 0 0 1px var(--crit-rule)} .chip.mand{background:transparent;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule-2)}
.chip.ok{background:var(--green-soft);color:var(--green)}
.alert{display:inline-flex;align-items:center;gap:5px;background:var(--crit);color:var(--sheet);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px 3px 6px;border-radius:2px;white-space:nowrap}
.alert svg{width:12px;height:12px}
.banner{border-radius:var(--r-lg);padding:14px 18px;display:flex;gap:14px;align-items:flex-start;margin-bottom:22px;border:1px solid}
.banner>svg{width:18px;height:18px;flex:none;margin-top:2px}
.banner.crit{background:var(--crit-soft);border-color:var(--crit-rule);color:var(--crit)} .banner.crit a{color:var(--crit);text-decoration:underline}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent);color:var(--ink)}
.banner.warn{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber-mark) 45%,transparent);color:var(--ink)}
.st-C{color:var(--green);font-weight:600} .st-P{color:var(--amber);font-weight:600} .st-N{color:var(--red);font-weight:700} .st-NA{color:var(--ink-3);font-weight:600}
.trend{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;white-space:nowrap}
.trend svg{width:12px;height:12px} .trend-up{color:var(--red)} .trend-down{color:var(--green)}
.bar{height:3px;background:var(--sunk);overflow:hidden;min-width:72px;margin-top:5px} .bar>i{display:block;height:100%}
.dist{display:flex;height:10px;gap:2px} .dist>i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:12px} .legend span::before{content:"";display:inline-block;width:9px;height:9px;background:var(--c);margin-right:7px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 20px;border-bottom:1px solid var(--rule)}
.filters input,.filters select{width:auto;min-width:150px;padding:6px 10px;font-size:13px}
.filters .search{position:relative;flex:0 1 280px} .filters .search input{width:100%;padding-left:32px;min-width:0}
.filters .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.empty{padding:44px 24px;text-align:center;color:var(--ink-3)}
.empty b{display:block;font:500 18px var(--serif);color:var(--ink);margin-bottom:4px}
.big-score{font:500 52px/1 var(--serif);letter-spacing:-.02em;font-variant-numeric:tabular-nums lining-nums}
.big-score small{font-size:.45em;color:var(--ink-3);margin-left:2px}
.info-list{display:grid;grid-template-columns:auto 1fr;gap:7px 20px;font-size:13.5px;margin:0} .info-list dt{color:var(--ink-3)} .info-list dd{margin:0;font-weight:500}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px}
.cols>.card+.card{margin-top:0}
.formula{background:var(--sunk);border-top:1px solid var(--rule);padding:14px 20px;font-size:13px;color:var(--ink-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.formula b{color:var(--ink)}
.statement{font:400 21px/1.5 var(--serif);max-width:62ch;color:var(--ink);margin:0}
.statement strong{font-weight:600}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:0}
.split>div{padding:22px 24px} .split>div+div{border-left:1px solid var(--rule)}
.score-col{min-width:230px;padding-left:28px;border-left:1px solid var(--rule)}
.line{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);color:inherit}
.line:last-child{border-bottom:0} .line:hover{text-decoration:none} .line:hover b{color:var(--accent)}
.seg-note{font-size:12px;color:var(--ink-3)}
/* chart */
.chart .band-g{fill:var(--band-g)} .chart .band-y{fill:var(--band-y)} .chart .band-r{fill:var(--band-r)}
.chart .grid{stroke:var(--rule)} .chart .tick{fill:var(--ink-3);font:10px var(--sans)}
.chart .ln{stroke:var(--ink);fill:none;stroke-width:1.75}
.chart .pt{fill:var(--sheet);stroke-width:2.5} .chart .lbl{fill:var(--ink);font:600 11px var(--sans)}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr;background:var(--bg)}
.login .cover{padding:44px 56px;display:flex;flex-direction:column;border-right:1px solid var(--rule)}
.login .cover .cover-mast{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--ink)}
.login .cover .cover-mast b{font:600 22px var(--serif);letter-spacing:.03em}
.login .cover .title{margin:auto 0;padding:48px 0}
.login .cover h1{font:400 clamp(40px,5vw,64px)/1.02 var(--serif);letter-spacing:-.025em;margin:18px 0 18px}
.login .cover h1 em{font-style:italic;color:var(--ink-2)}
.login .cover p{max-width:46ch;color:var(--ink-2);font-size:15px;margin:0}
.login .cover dl{display:grid;grid-template-columns:auto 1fr;gap:6px 24px;font-size:12.5px;border-top:1px solid var(--rule);padding-top:16px;margin:0}
.login .cover dt{color:var(--ink-3)} .login .cover dd{margin:0}
.login .form{display:grid;place-items:center;padding:40px 32px;position:relative}
.login .form .theme{position:absolute;top:24px;right:24px}
.login .box{width:100%;max-width:380px}
.login .box h2{font-size:28px;margin-bottom:6px}
.demo-acc{margin-top:28px;border-top:1px solid var(--rule)}
.demo-acc .h{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:14px 0 6px}
.demo-acc button{display:flex;width:100%;justify-content:space-between;gap:12px;border:0;border-bottom:1px solid var(--rule);background:none;padding:10px 4px;cursor:pointer;text-align:left;font-size:13px;color:var(--ink);transition:background .12s}
.demo-acc button:hover{background:var(--hover)} .demo-acc button span+span{color:var(--ink-3);font-size:12px}
.err{color:var(--red);font-size:13px;margin:6px 0;min-height:1em}

/* modal & toast */
.modal-bg{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .2s var(--ease)}
.modal{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);animation:rise .32s var(--ease)}
.modal .hd{padding:18px 22px 14px;border-bottom:1px solid var(--rule);display:flex;align-items:center} .modal .bd{padding:20px 22px} .modal .ft{padding:14px 22px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end;gap:8px;background:var(--sunk)}
@keyframes fade{from{opacity:0}} @keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:var(--r);z-index:60;box-shadow:var(--shadow-lg);max-width:420px;display:flex;gap:10px;align-items:center;font-weight:500;animation:rise .3s var(--ease)}
.toast svg{width:16px;height:16px} .toast.bad{background:var(--red-mark);color:#fff}

/* Area Coordinator visit form */
.ac-wrap{max-width:820px;margin:0 auto}
.centre-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.centre-cards .card{display:flex;flex-direction:column} .centre-cards .bd{display:flex;flex-direction:column;flex:1}
.centre-cards .btn{margin-top:auto;align-self:flex-start}
.draft{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--amber);margin-bottom:12px}
.draft::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber-mark)}
.progress{height:3px;background:var(--rule);overflow:hidden} .progress>i{display:block;height:100%;background:var(--accent);transition:width .3s var(--ease)}
.sticky-prog{position:sticky;top:52px;z-index:4;background:var(--bg);padding:14px 0 12px;margin-bottom:6px}
.steps{display:flex;gap:4px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.steps button{border:1px solid var(--rule-2);background:var(--sheet);border-radius:var(--r);padding:6px 12px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.steps button:hover{border-color:var(--ink-3);color:var(--ink)}
.steps button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)} .steps button.done{color:var(--green);border-color:color-mix(in srgb,var(--green-mark) 50%,transparent)}
.steps svg{width:13px;height:13px}
.crit-card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:10px;transition:border-color .15s}
.crit-card.missing{border-color:var(--red-mark)}
.crit-card .q{font-weight:600;font-size:14.5px;line-height:1.45}
.opts{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule-2);border-radius:var(--r);margin:12px 0 10px;overflow:hidden}
.opts label{position:relative;padding:10px 6px;text-align:center;cursor:pointer;font-size:13px;font-weight:500;user-select:none;color:var(--ink-2);min-height:44px;display:grid;place-items:center;transition:background .12s,color .12s}
.opts label+label{border-left:1px solid var(--rule-2)}
.opts label:hover{background:var(--hover);color:var(--ink)}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts label:has(input:checked).C{background:var(--green-soft);color:var(--green);font-weight:600}
.opts label:has(input:checked).P{background:var(--amber-soft);color:var(--amber);font-weight:600}
.opts label:has(input:checked).N{background:var(--red-soft);color:var(--red);font-weight:600}
.opts label:has(input:checked).NA{background:var(--grey-soft);color:var(--ink);font-weight:600}
.opts label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.opts label.disabled{opacity:.35;cursor:not-allowed;background:repeating-linear-gradient(-45deg,transparent 0 6px,var(--sunk) 6px 7px)}
.req{color:var(--red);font-size:12px;font-weight:600}
.done-mark{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--green-mark);color:var(--green);display:grid;place-items:center;margin:0 auto 18px}
.done-mark svg{width:24px;height:24px}

@media (max-width:1180px){
  .split{grid-template-columns:1fr} .split>div+div{border-left:0;border-top:1px solid var(--rule)}
  .with-rail{grid-template-columns:1fr} .rail{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .brand small,.user .who{display:none}
}
@media (max-width:900px){
  .mast-in{height:auto;flex-wrap:wrap;gap:0;padding:0 16px}
  .brand{height:54px} .mast-end{margin-left:auto;height:54px}
  .nav{order:3;flex:1 1 100%;height:44px;margin:0 -16px;padding:0 4px;border-top:1px solid var(--rule)}
  .content{padding:22px 16px 56px} .ph h1{font-size:27px}
  .mast-end .stamp{display:none}
  .login{grid-template-columns:1fr} .login .cover{padding:28px 20px;border-right:0;border-bottom:1px solid var(--rule)} .login .cover .title{padding:28px 0}
  .grid2{grid-template-columns:1fr} .filters{padding:12px 16px} .filters .search{flex:1 1 100%}
  .opts{grid-template-columns:repeat(2,1fr)} .opts label:nth-child(3){border-left:0} .opts label:nth-child(n+3){border-top:1px solid var(--rule-2)}
  .score-col{border-left:0;padding-left:0;border-top:1px solid var(--rule);padding-top:18px;width:100%}
  .cols{grid-template-columns:1fr} h1{font-size:24px} .big-score{font-size:44px} .statement{font-size:18px}
  .card>.hd,.card>.bd{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{
  :root{--bg:#fff;--sheet:#fff;--shadow:none}
  .mast,.no-print,.filters{display:none!important} .app{display:block} .content{padding:0;max-width:none} .card{box-shadow:none;break-inside:avoid} body{background:#fff}
}
</style>
